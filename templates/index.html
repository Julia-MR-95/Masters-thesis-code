<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iconicidad: Participantes</title>
    <!-- Tema de Simple de Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@4.5.2/dist/simplex/bootstrap.min.css">

    <!-- Google Fonts: Permanent Marker -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">

    <!-- JavaScript de Bootstrap 5 (necesario para dropdowns) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

    <!-- Select2 -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

</head>

<body>
    <main class="container formulario p-4">
        <h1>Información de los participantes</h1>

        <div class="row"> <!-- etiqueta div indica bloque/paquete organizativo -->
            <!--desde aquí aplica CSS .row -->
            <div class="participante"> <!--Creacion del objeto participante-->
            <!--desde aquí aplica CSS -->
                <div class="participante-header">
                    <form action="/crear-participante" method="post"> <!--ruta a donde enviamos la info (guion normal)-->

                        <!-- INFORMACIÓN PARTICIPANTES -->
                        <!-- autofocus: al entrar en la web el foco del ratón esté en ese texto -->
                        <div class="form-group mb-3"> <!-- mb-3 añade margen inferior para mejorar el espacio-->
                            <div class="row">
                                <!---Nombre--->
                                <div class="col">
                                    <input name="nombre" type="text" placeholder="Nombre" class="form-control" autofocus>
                                </div>
                                <!---Apellidos--->
                                <div class="col">
                                    <input name="apellidos" type="text" placeholder="Apellidos" class="form-control" autofocus>
                                </div>
                            </div>
                        </div>
                        <!--- Edad y Estudios --->
                        <div class="form-group mb-3"> <!-- mb-3 añade margen inferior para mejorar el espacio-->
                            <div class="row">
                            <!-- Edad -->
                                <div class="col">
                                    <input name="edad" type="text" placeholder="Edad" class="form-control" autofocus>
                                </div>
                            <!-- Estudios -->
                                <div class="col">
                                    <select id="nivel_estudios" name="nivel_estudios" class="form-select form-select-sm" required>
                                        <!--<option value="" disabled selected>Nivel de estudios</option>
                                        No hace falta porque está en js>lenguas.js -->
                                        <option></option>
                                        <option value="eso">ESO</option>
                                        <option value="bachillerato">Bachillerato</option>
                                        <option value="grado_medio">Grado Medio</option>
                                        <option value="grado_superior">Grado Superior</option>
                                        <option value="grado_universitario">Grado Universitario</option>
                                        <option value="postgrado">Postgrado</option>
                                        <option value="doctorado">Doctorado</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!--- Selección LENGUA MATERNA --->
                        <div class="form-group mb-3">
                            <select id="lengua_materna" name="lengua_materna" class="form-select form-select-sm" required>
                                <!---<option value="" disabled selected>Lengua materna</option>
                                No hace falta porque está en js>lenguas.js -->
                                <option></option>
                                {% for lengua in lenguas %}
                                <option value="{{ lengua.nombre }}">{{ lengua.nombre }}</option>
                                <!-- value es lq pasamos a la siguiente página y queremos el nombre, no el ID de la lengua para la BBDD  -->
                                {% endfor %}
                            </select>
                        </div>

                        <!--- Selección OTROS IDIOMAS --->
                        <div class="form-group mb-3">
                            <select id="otras_lenguas" name="otras_lenguas" class="form-select form-select-sm" multiple>
                                <!--<option value="" disabled selected>Otras lenguas o en blanco</option>
                                No hace falta porque está en js>lenguas.js -->
                                <option></option>
                                {%for lengua in lenguas %}
                                    <option value="{{ lengua.nombre }}">{{ lengua.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Script de Select2 -->
                        <script src="{{ url_for('static', filename='js/lenguas.js') }}"></script>
                        <!-- se podría poner el JS dentro de un script o al final del body;
                        funcionaría pq HTML ya está cargado, jQuery espera a que el DOM esté listo
                        y Select2 se inicializaría sobre elementos que ya existen -->

                        <!--- BOTONES --->
                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <!--  GUARDAR -->
                            <button type="submit" class="btn btn-dark btn-block">
                                <!-- btn-block hace que ocupe todo el ancho-->
                                Guardar y continuar <!-- texto del botón -->
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
